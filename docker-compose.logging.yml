version: "3.8"

services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: product_catalog_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - product_catalog_network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: product_catalog_kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=a]32!char#min$strong%encr^yption&key*for(kibana>alerting
      - XPACK_REPORTING_ENCRYPTIONKEY=b]32!char#min$strong%encr^yption&key*for(kibana>reporting
      - XPACK_SECURITY_ENCRYPTIONKEY=c]32!char#min$strong%encr^yption&key*for(kibana>security
    ports:
      - "5601:5601"
    networks:
      - product_catalog_network

volumes:
  es_data:

networks:
  product_catalog_network:
    driver: bridge
