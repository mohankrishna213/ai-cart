<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Products – AI Cart</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="products-section">
        <h2>All Products</h2>

        <div th:fragment="productList (products)">
            <div class="products-grid" style="margin-top: 24px;">
                <div class="product-card" th:each="product : ${products}">
                    <a th:href="@{'/product/' + ${product.id}}">
                        <img th:src="@{${product.imageUrl}}" th:alt="${product.name}" />
                        <h3 th:text="${product.name}">Product Name</h3>
                        <p th:text="'₹ ' + ${product.price}">Price</p>
                    </a>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(products)}" class="empty-state">
                <i class="fas fa-box-open"></i>
                <p>No products found.</p>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>© 2026 AI Cart · Capstone Project</p>
    </footer>
</body>
</html>
