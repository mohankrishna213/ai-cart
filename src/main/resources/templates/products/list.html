<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Product List</title>
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
    <h1>All Products</h1>
    <form th:action="@{/products/search}" method="get">
        <input type="text" name="q" placeholder="Search products..." />
        <button type="submit">Search</button>
    </form>
    <div class="product-grid">
        <div th:each="product : ${products}" class="product-card">
            <h2 th:text="${product.name}">Product Name</h2>
            <p th:text="${product.description}">Description</p>
            <p>₹<span th:text="${product.price}">0.00</span></p>
            <a th:href="@{'/products/' + ${product.id}}">View Details</a>
        </div>
    </div>

    <div th:fragment="productList(products)">
        <div th:each="product : ${products}">
            <a th:href="@{'/product/' + ${product.id}}">
                <img th:src="${product.imageUrl}" width="100"/>
                <span th:text="${product.name}"></span>
            </a>
            <span>Price: <span th:text="${product.price}"></span></span>
        </div>
    </div>
</body>
</html>
