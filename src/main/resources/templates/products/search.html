<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Search Results</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <style>
        body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        color: #444;
    }
    a {
        text-decoration: none;
        color: #444;
    }
    .nav-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 20px;
        background-color: #f5f5f5;
    }

    .logo {
        font-weight: bold;
        font-size: 1.5em;
        color: #333;
    }

    .img {
        width: 150px;
        margin-bottom: 20px;
    }

    .search-bar input {
        padding: 5px;
        width: 200px;
    }

    nav ul {
        display: flex;
        list-style: none;
        padding: 0;
        margin: 0;
    }

    nav ul li {
        margin: 0 10px;
    }

    .top-links {
        display: flex;
        gap: 15px;
        align-items: center;
    }

    .account-dropdown {
        position: relative;
    }

    .account-dropdown button {
        background: none;
        border: none;
        cursor: pointer;
    }

    .dropdown-content {
        display: none;
        position: absolute;
        top: 100%;
        right: 0;
        background-color: white;
        box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        padding: 10px;
    }

    .account-dropdown:hover .dropdown-content {
        display: block;
    }
    .products-section {
        padding: 20px;
        background-color: #fafafa;
    }
    </style>
</head>
<body>
    <!-- Header Section -->
    <header>
        <div class="nav-container">
            <a th:href="@{/home}"><img src="https://deq64r0ss2hgl.cloudfront.net/images/websitelogos/techmlsa_site_logo.jpg?v=8787" class="img" alt="Tech Mahindra Logo"></a>
            <div class="search-bar">
                <form th:action="@{/products/search}" method="get">
                    <input type="text" name="q" placeholder="Search products..." />
                    <button type="submit">🔍</button>
                </form>
            </div>
            <nav>
                <ul>
                    <li th:each="category : ${categories}">
                        <a th:text="${category.name}" th:href="@{'/category/' + ${category.id}}"></a>
                    </li>
                </ul>
            </nav>
            <div class="top-links">
    <a th:if="${!isAdmin}" th:href="@{/wishlist}">Wishlist</a>

    <!-- Show login if user not logged in -->
    <div th:if="${remoteUser == null}">
        <a th:href="@{/auth/loginPage}">
            <button>Login</button>
        </a>
    </div>

    <!-- Show account dropdown if user is logged in -->
    <div class="account-dropdown" th:if="${remoteUser != null}">
        <button>Hello, friend ⌄</button>
        <div class="dropdown-content">
            <form th:action="@{/logout}" method="post">
                <button type="submit">Logout</button>
            </form>
        </div>
    </div>
</div>

        </div>
    </header>
    <main class="products-section">
<!--     <h1>Search Results for "<span th:text="${searchTerm}">term</span>"</h1> -->
    <div th:replace="products/list :: productList(products=${products})"></div>
</body>
</html>
