<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Product Detail</title>
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
    <h1 th:text="${product.name}">Product Name</h1>
    <p th:text="${product.description}">Description</p>
    <p>Price: ₹<span th:text="${product.price}">0.00</span></p>
    <p>Stock: <span th:text="${product.stockQuantity}">0</span></p>
    <p th:if="${product.available}">✅ Available</p>
    <p th:unless="${product.available}">❌ Out of Stock</p>
    <img th:src="${product.imageUrl}" alt="Product Image" style="max-width:300px;" />
    <a href="/products">Back to Product List</a>
</body>
</html>
