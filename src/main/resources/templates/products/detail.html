<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.name} + ' | AI Cart'">Product Details</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="product-details-container">
        <div class="image-section">
            <img th:src="@{${product.imageUrl}}" th:alt="${product.name}" />
        </div>
        <div class="info-section">
            <h1 th:text="${product.name}">Product Name</h1>
            <p th:text="${product.description}">Product description goes here.</p>

            <p class="stock-info">
                <i class="fas fa-box" style="color: var(--accent-blue);"></i>
                <span th:text="'Stock: ' + ${product.stockQuantity}"></span>
            </p>
            <p class="stock-info">
                <i class="fas fa-circle" th:style="${product.available} ? 'color: var(--accent-green); font-size: 0.5rem;' : 'color: var(--danger); font-size: 0.5rem;'"></i>
                <span th:text="${product.available} ? 'Available' : 'Out of Stock'"></span>
            </p>

            <div class="price-section">
                <p class="total-price" th:text="'₹ ' + ${product.price}">₹ 0.00</p>

                <div id="wishlistMessage"></div>

                <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center;">
                    <form th:action="@{'/products/wishlist/add/' + ${product.id}}"
                          method="post"
                          id="addToWishlistForm"
                          th:data-auth="${currentUserId != null}"
                          th:if="${!isAdmin}">
                        <button type="submit" class="add-to-cart" id="addToWishlistBtn">
                            <i class="fas fa-heart"></i> Add To Wishlist
                        </button>
                    </form>

                    <button class="add-review-btn"
                            th:data-auth="${currentUserId != null}"
                            onclick="openPopup(this.getAttribute('data-auth'))"
                            th:if="${!isAdmin}">
                        <i class="fas fa-pen"></i> Write a Review
                    </button>
                </div>
            </div>

            <!-- Reviews -->
            <div class="reviews-section">
                <h3><i class="fas fa-comments" style="margin-right: 8px; color: var(--accent-blue);"></i> Reviews</h3>

                <div th:if="${#lists.isEmpty(reviews)}" class="empty-state" style="padding: 24px 0;">
                    <i class="far fa-comment-dots"></i>
                    <p>No reviews yet. Be the first to review!</p>
                </div>

                <div th:each="review : ${reviews}" class="review-card">
                    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
                        <div>
                            <strong th:text="${review.user != null ? review.user.username : 'Unknown User'}">Username</strong>
                            <span class="review-rating">
                                <i class="fas fa-star"></i>
                                <span th:text="${review.rating}"></span>
                            </span>
                        </div>
                    </div>
                    <div class="review-title" th:text="${review.title}">Review Title</div>
                    <p class="review-content" th:text="${review.content}">Review Content</p>
                    <form th:if="${isAdmin
                               or (currentUserId != null
                                   and review.user != null
                                   and currentUserId == review.user.id)}"
                        th:action="@{/products/{prodId}/reviews/{revId}/remove(
                                        prodId=${product.id},
                                        revId=${review.id})}"
                        method="post"
                        style="display:inline;">
                        <button type="submit" class="remove-review-btn">
                            <i class="fas fa-trash-alt"></i> Remove
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Review Popup -->
    <div class="popup-card" id="reviewPopup">
        <div class="popup-content">
            <button class="popup-close" onclick="closePopup()">&times;</button>
            <h3><i class="fas fa-pen" style="margin-right: 8px; color: var(--accent-blue);"></i> Write a Review</h3>
            <form th:action="@{'/api/reviews/product/' + ${product.id}}"
                  method="post"
                  id="reviewForm">
                <input type="text" name="title" placeholder="Review title" required />
                <textarea name="content" placeholder="Share your experience..." required></textarea>

                <div class="slider-rating-container">
                    <label for="ratingInput" style="font-weight: 600; white-space: nowrap;">
                        <i class="fas fa-star" style="color: var(--star-color);"></i> Rating:
                    </label>
                    <input type="number"
                           name="rating"
                           id="ratingInput"
                           min="0.5"
                           max="5"
                           step="0.5"
                           value="5"
                           style="width: 70px;"
                           required />
                </div>

                <div id="reviewError" class="alert alert-danger" style="display: none;"></div>

                <button type="submit">Submit Review</button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>© 2026 AI Cart · Capstone Project</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const wMessage = document.getElementById('wishlistMessage');
            
            if (urlParams.get('wishlistAdded') === 'true' && wMessage) {
                wMessage.innerHTML = '<i class="fas fa-check-circle"></i> Product added to your wishlist!';
                wMessage.style.background = '#f0fdf4';
                wMessage.style.color = '#166534';
                wMessage.style.borderColor = '#bbf7d0';
                wMessage.style.display = 'block';
                
                // Clean URL
                window.history.replaceState({}, document.title, window.location.pathname);
            }
            
            if (urlParams.get('openReview') === 'true') {
                document.getElementById('reviewPopup').style.display = 'flex';
                // Clean URL
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        });
        const wishlistMessage = document.getElementById('wishlistMessage');
        const addToWishlistForm = document.getElementById('addToWishlistForm');

        addToWishlistForm?.addEventListener('submit', function(e) {
            e.preventDefault();

            if (this.getAttribute('data-auth') !== 'true') {
                const productId = window.location.pathname.split('/').pop();
                window.location.href = `/auth/loginPage?redirect=/products/wishlist/add-get/${productId}`;
                return;
            }

            wishlistMessage.style.display = 'none';
            wishlistMessage.textContent = '';

            const btn = document.getElementById('addToWishlistBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Adding...';
            btn.disabled = true;

            fetch(this.action, { method: 'POST' })
                .then(res => {
                    if (res.status === 208) {
                        wishlistMessage.innerHTML = '<i class="fas fa-info-circle"></i> Product is already in your wishlist';
                        wishlistMessage.style.background = '#fffbeb';
                        wishlistMessage.style.color = '#92400e';
                        wishlistMessage.style.borderColor = '#fde68a';
                    } else if (res.ok) {
                        wishlistMessage.innerHTML = '<i class="fas fa-check-circle"></i> Product added to your wishlist!';
                        wishlistMessage.style.background = '#f0fdf4';
                        wishlistMessage.style.color = '#166534';
                        wishlistMessage.style.borderColor = '#bbf7d0';
                    } else {
                        wishlistMessage.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Could not add to wishlist. Please try again.';
                        wishlistMessage.style.background = '#fef2f2';
                        wishlistMessage.style.color = '#991b1b';
                        wishlistMessage.style.borderColor = '#fecaca';
                    }
                    wishlistMessage.style.display = 'block';
                })
                .catch(err => {
                    console.error('Network error:', err);
                    wishlistMessage.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Network error. Check your connection.';
                    wishlistMessage.style.display = 'block';
                })
                .finally(() => {
                    btn.innerHTML = '<i class="fas fa-heart"></i> Add To Wishlist';
                    btn.disabled = false;
                });
        });

        function openPopup(isAuth) {
            if (isAuth !== 'true') {
                const productId = window.location.pathname.split('/').pop();
                window.location.href = `/auth/loginPage?redirect=/product/${productId}?openReview=true`;
                return;
            }
            document.getElementById('reviewPopup').style.display = 'flex';
        }

        function closePopup() {
            document.getElementById('reviewPopup').style.display = 'none';
        }

        // Close popup on backdrop click
        document.getElementById('reviewPopup').addEventListener('click', function(e) {
            if (e.target === this) closePopup();
        });

        document.getElementById('reviewForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const fd = new FormData(this);
            const payload = {
                title: fd.get('title'),
                content: fd.get('content'),
                rating: parseFloat(fd.get('rating'))
            };

            const btn = this.querySelector('button[type="submit"]');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';
            btn.disabled = true;

            fetch(this.action, {
                method: 'POST',
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => {
                if (res.status === 201) {
                    closePopup();
                    location.reload();
                } else {
                    const errDiv = document.getElementById('reviewError');
                    errDiv.innerHTML = '<i class="fas fa-exclamation-circle"></i> You have already reviewed this product';
                    errDiv.style.display = 'block';
                }
            })
            .catch(console.error)
            .finally(() => {
                btn.innerHTML = 'Submit Review';
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
