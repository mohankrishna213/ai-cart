<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Products – AI Cart</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="products-section">
        <div class="products-grid">
            <div class="product-card" th:each="product : ${products}">
                <a th:href="@{'/product/' + ${product.id}}">
                    <img th:src="@{${product.imageUrl}}" th:alt="${product.name}" />
                    <h3 th:text="${product.name}">Product Name</h3>
                    <p th:text="'₹ ' + ${product.price}">Price</p>
                </a>
                <!-- Admin Product Controls -->
                <div th:if="${isAdmin}" class="admin-controls">
                    <button
                      th:attr="data-id=${product.id},data-name=${product.name},data-price=${product.price},data-imageurl=${product.imageUrl},data-description=${product.description},data-available=${product.available},data-stockquantity=${product.stockQuantity}"
                      onclick="editProductFromData(this)">
                        <i class="fas fa-edit"></i> Edit
                    </button>
                    <button th:onclick="'deleteProduct(' + ${product.id} + ')'">
                        <i class="fas fa-trash"></i> Delete
                    </button>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(products)}" class="empty-state">
            <i class="fas fa-box-open"></i>
            <p>No products in this category yet.</p>
        </div>

        <!-- Admin Add Product Button -->
        <div th:if="${isAdmin}" style="margin-top: 24px; text-align: right;">
            <button onclick="openAddProductModal()" class="login-btn" style="font-size: 14px;">
                <i class="fas fa-plus-circle"></i> Add Product
            </button>
        </div>

    <!-- Product Modal Popup -->
    <div id="productModal" class="popup-card">
        <div class="popup-content">
            <button class="popup-close" onclick="closeProductModal()">&times;</button>
            <h3 id="productModalTitle">Add Product</h3>
            <form id="productForm">
                <input type="hidden" id="prodId" name="id" />
                <input type="hidden" id="prodCategoryId" name="categoryId" th:value="${categoryId}" />
                <input type="text" id="prodName" name="name" placeholder="Product name" required />
                <textarea id="prodDesc" name="description" placeholder="Product description" required></textarea>
                <input type="number" id="prodPrice" name="price" placeholder="Price (₹)" required step="0.01" min="0" />
                <div style="display: flex; align-items: center; gap: 10px;">
                    <input type="checkbox" id="prodAvailable" name="available" style="width: auto;" />
                    <label for="prodAvailable" style="margin: 0; font-weight: 500;">Available</label>
                </div>
                <input type="number" id="prodStock" name="stockQuantity" placeholder="Stock quantity" min="0" />
                <input type="text" id="prodImage" name="imageUrl" placeholder="Image URL" required />
                <div style="display: flex; gap: 8px;">
                    <button type="submit">Save Product</button>
                    <button type="button" onclick="closeProductModal()" style="background: var(--bg); color: var(--text-secondary); border: 1px solid var(--border);">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
    function openAddProductModal() {
        document.getElementById('prodId').value = '';
        document.getElementById('prodName').value = '';
        document.getElementById('prodDesc').value = '';
        document.getElementById('prodPrice').value = '';
        document.getElementById('prodAvailable').checked = true;
        document.getElementById('prodStock').value = '';
        document.getElementById('prodImage').value = '';
        document.getElementById('productModalTitle').textContent = 'Add Product';
        document.getElementById('productModal').style.display = 'flex';
    }

    function openEditProductModal(id, name, price, imageUrl, description, available, stockQuantity) {
        document.getElementById('prodId').value = id;
        document.getElementById('prodName').value = name;
        document.getElementById('prodDesc').value = description;
        document.getElementById('prodPrice').value = price;
        document.getElementById('prodAvailable').checked = available === true || available === 'true';
        document.getElementById('prodStock').value = stockQuantity;
        document.getElementById('prodImage').value = imageUrl;
        document.getElementById('productModalTitle').textContent = 'Edit Product';
        document.getElementById('productModal').style.display = 'flex';
    }

    function editProductFromData(btn) {
        openEditProductModal(
            btn.getAttribute('data-id'),
            btn.getAttribute('data-name'),
            btn.getAttribute('data-price'),
            btn.getAttribute('data-imageurl'),
            btn.getAttribute('data-description'),
            btn.getAttribute('data-available'),
            btn.getAttribute('data-stockquantity')
        );
    }

    function closeProductModal() {
        document.getElementById('productModal').style.display = 'none';
    }

    // Close on backdrop click
    document.getElementById('productModal').addEventListener('click', function(e) {
        if (e.target === this) closeProductModal();
    });

    document.getElementById('productForm').onsubmit = function(e) {
        e.preventDefault();
        var id = document.getElementById('prodId').value;
        var name = document.getElementById('prodName').value;
        var description = document.getElementById('prodDesc').value;
        var price = document.getElementById('prodPrice').value;
        var available = document.getElementById('prodAvailable').checked;
        var stockQuantity = document.getElementById('prodStock').value;
        var imageUrl = document.getElementById('prodImage').value;
        var categoryId = document.getElementById('prodCategoryId').value;
        var url = id ? '/admin/product/edit' : '/admin/product/add';
        fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, name, description, price, available, stockQuantity, imageUrl, categoryId })
        }).then(r => r.json()).then(data => {
            location.reload();
        });
    };

    function deleteProduct(id) {
        if(confirm('Are you sure you want to delete this product?')) {
            fetch('/admin/product/delete/' + id, { method: 'DELETE' })
                .then(r => r.json()).then(data => { location.reload(); });
        }
    }
    </script>
    </main>

    <footer class="footer">
        <p>© 2026 AI Cart · Capstone Project</p>
    </footer>
</body>
</html>
