<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap');
    body {
        font-family: Nunito, sans-serif;
        margin: 0;
        padding: 0;
        color: #444;
    }
    a {
        text-decoration: none;
        color: #444;
    }
    .icon {
      font-family: "Font Awesome 6 Free";
      font-weight: 200;
    }
    .user::before {
      content: "\f007";
      margin-right: 8px;
    }
    .nav-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 20px;
        background-color: #ffffff;
    }

    .logo {
        font-weight: bold;
        font-size: 1.5em;
        color: #333;
    }

    .img {
        width: 150px;
        margin-bottom: 20px;
    }

	.search-bar {
	  width: 490px;
	  margin-top:10px;
	  height:60px;
	  margin-left: 200px;
  	  margin-right: auto;
	  
	}
	
	.search-bar input[type="text"] {
	  width: 100%;
	  height: 45px;
	  padding: 0 20px;
	  font-size: 1rem;
	  border: 1px solid #808080;
	  outline: none;
	  transition: border 0.35s ease, color 0.35s ease;
	  border-radius:30px;
	}
	
	.search-bar input[type="text"]:focus {
	  border: 1px solid #808080;
	  color: #808080;
	}
	
	.search-bar input[type="text"]::placeholder {
	  transition: opacity 0.45s ease;
	}
	
	.search-bar input[type="text"]:focus::placeholder {
	  opacity: 0;
	}
	
	.search-bar button {
	  position: relative;
	  float: right;
	  height: 45px;
	  padding: 0 20px;
	  font-size: 1.2rem;
	  background: none;
	  border: none;
	  cursor: pointer;
	}


    nav ul {
        display: flex;
        list-style: none;
        padding: 0;
        margin: 0;
    }

    nav ul li {
        margin: 0 10px;
    }

    .top-links {
        display: flex;
        gap: 15px;
        align-items: center;
    }

    .account-dropdown {
        position: relative;
    }

    .account-dropdown button {
        background: none;
        border: none;
        cursor: pointer;
    }

    .dropdown-content {
        display: none;
        position: absolute;
        top: 100%;
        right: 0;
        background-color: white;
        box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        padding: 10px;
    }

    .account-dropdown:hover .dropdown-content {
        display: block;
    }
    </style>
</head>
<body>
    <!-- Header Section -->
    <header>
        <div class="nav-container">
            <a th:href="@{/home}"><img src="https://deq64r0ss2hgl.cloudfront.net/images/websitelogos/techmlsa_site_logo.jpg?v=8787" class="img" alt="Tech Mahindra Logo"></a>
            <div class="search-bar">
                <form th:action="@{/products/search}" method="get">
                    <input type="text" name="q" placeholder="Search products..." />
                    <button type="submit"></button>
                </form>
            </div>
            <div class="top-links">
		    	<a class ="fa fa-heart" style="font-weight: 400; margin-right: 30px;" th:if="${!isAdmin}" th:href="@{/wishlist}"></a>
		
			    <!-- Show login if user not logged in -->
			    <div th:if="${remoteUser == null}">
			        <a th:href="@{/auth/loginPage}">
			            <button>Login</button>
			        </a>
			    </div>

			    <!-- Show account dropdown if user is logged in -->
			    <div class="account-dropdown" th:if="${remoteUser != null}">
			        <div class="icon user"></div>
			        <div class="dropdown-content">
			            <form th:action="@{/logout}" method="post">
			                <button type="submit">Logout</button>
			            </form>
			        </div>
			    </div>
			</div>

        </div>
    </header>
