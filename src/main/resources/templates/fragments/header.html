<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>
    <!-- Header Fragment -->
    <header th:fragment="header">
        <div class="nav-container">
            <a th:href="@{/home}">
                <img th:src="@{/images/Ecommerce_Logo.png}" class="img" alt="AI Cart">
            </a>

            <!-- Mobile menu toggle -->
            <button class="mobile-menu-toggle" aria-label="Toggle navigation">
                <i class="fas fa-bars"></i>
            </button>

            <div class="search-bar">
                <form th:action="@{/products/search}" method="get">
                    <input type="text" name="q" placeholder="Search products, brands..." />
                    <button type="submit"><i class="fas fa-search"></i></button>
                </form>
            </div>

            <div class="top-links">
                <a class="fa fa-heart wishlist-icon" th:if="${!isAdmin}" th:href="@{/wishlist}" title="My Wishlist"></a>

                <!-- Login button for unauthenticated users -->
                <div th:if="${remoteUser == null}">
                    <a th:href="@{/auth/loginPage}">
                        <button class="login-btn">Login</button>
                    </a>
                </div>

                <!-- Account dropdown for authenticated users -->
                <div class="account-dropdown" th:if="${remoteUser != null}">
                    <div class="icon user"></div>
                    <div class="dropdown-content">
                        <form th:action="@{/logout}" method="post">
                            <button type="submit"><i class="fas fa-sign-out-alt"></i> &nbsp;Logout</button>
                        </form>
                    </div>
                </div>

                <!-- Mobile categories (shown in hamburger on mobile) -->
                <div class="mobile-categories" th:if="${categories != null}">
                    <div class="mobile-categories-label">Categories</div>
                    <a th:each="category : ${categories}"
                       th:text="${category.name}"
                       th:href="@{'/category/' + ${category.id}}"></a>
                </div>
            </div>
        </div>
        <script>
            // Mobile menu toggle
            document.addEventListener('DOMContentLoaded', function() {
                const mobileMenuToggle = document.querySelector('.mobile-menu-toggle');
                const topLinks = document.querySelector('.top-links');

                if (mobileMenuToggle && topLinks) {
                    mobileMenuToggle.addEventListener('click', function() {
                        topLinks.classList.toggle('mobile-menu-open');
                        
                        const categories = document.querySelector('.mobile-categories');
                        if (categories && topLinks.classList.contains('mobile-menu-open')) {
                            const rect = mobileMenuToggle.getBoundingClientRect();
                            const topLinksRect = topLinks.getBoundingClientRect();
                            // align accurately below the menu toggle by adjusting for topLinks position
                            categories.style.left = (rect.left - topLinksRect.left) + 'px';
                        }

                        const icon = this.querySelector('i');
                        if (icon) {
                            icon.classList.toggle('fa-bars');
                            icon.classList.toggle('fa-times');
                        }
                    });

                    document.addEventListener('click', function(event) {
                        if (!mobileMenuToggle.contains(event.target) && !topLinks.contains(event.target)) {
                            topLinks.classList.remove('mobile-menu-open');
                            const icon = mobileMenuToggle.querySelector('i');
                            if (icon) {
                                icon.classList.remove('fa-times');
                                icon.classList.add('fa-bars');
                            }
                        }
                    });
                }
            });
        </script>
        
        <!-- Chatbot Component -->
        <div th:replace="~{fragments/chatbot :: chatbot}"></div>
    </header>
</body>
</html>
