<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist – AI Cart</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="products-section">
        <h2>
            <i class="fas fa-heart" style="margin-right: 8px; color: var(--primary);"></i> My Wishlist
        </h2>

        <div class="products-grid" style="margin-top: 24px;">
            <div class="product-card" th:each="item : ${wishlistItems}" style="position: relative;">
                <a th:href="@{'/product/' + ${item.product.id}}">
                    <img th:src="${item.product.imageUrl}" th:alt="${item.product.name}" />
                    <h3 th:text="${item.product.name}">Product Name</h3>
                </a>
                <form th:action="@{/wishlist/remove/{id}(id=${item.product.id})}" method="post">
                    <button type="submit" class="remove-btn">
                        <i class="fas fa-times"></i> Remove
                    </button>
                </form>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(wishlistItems)}" class="empty-state">
            <i class="far fa-heart" style="font-size: 4rem;"></i>
            <p style="margin-top: 16px;">Your wishlist is empty</p>
            <a th:href="@{/home}" class="login-btn" style="display: inline-block; margin-top: 16px; text-decoration: none;">
                Browse Products
            </a>
        </div>
    </main>

    <footer class="footer">
        <p>© 2026 AI Cart · Capstone Project</p>
    </footer>
</body>
</html>
