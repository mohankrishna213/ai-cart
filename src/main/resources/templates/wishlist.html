<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Wishlist</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        color: #444;
    }
    a {
        text-decoration: none;
        color: #444;
    }
    .nav-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 20px;
        background-color: #f5f5f5;
    }

    .logo {
        font-weight: bold;
        font-size: 1.5em;
        color: #333;
    }

    .img {
        width: 150px;
        margin-bottom: 20px;
    }

    .search-bar input {
        padding: 5px;
        width: 200px;
    }

    nav ul {
        display: flex;
        list-style: none;
        padding: 0;
        margin: 0;
    }

    nav ul li {
        margin: 0 10px;
    }

    .top-links {
        display: flex;
        gap: 15px;
        align-items: center;
    }

    .account-dropdown {
        position: relative;
    }

    .account-dropdown button {
        background: none;
        border: none;
        cursor: pointer;
    }

    .dropdown-content {
        display: none;
        position: absolute;
        top: 100%;
        right: 0;
        background-color: white;
        box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        padding: 10px;
    }

    .account-dropdown:hover .dropdown-content {
        display: block;
    }
    .products-section {
        padding: 20px;
        background-color: #fafafa;
    }
    .products-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
    }
    .product-card {
        border: 1px solid #ddd;
        padding: 15px;
        text-align: center;
        background-color: white;
        position: relative;
    }
    .product-card img {
        width: 100%;
        height: auto;
        margin-bottom: 10px;
    }
    .remove-btn {
        background: #e25555;
        color: #fff;
        border: none;
        padding: 7px 16px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 1em;
        position: absolute;
        top: 10px;
        right: 10px;
        transition: background 0.2s;
    }
    .remove-btn:hover {
        background: #b71c1c;
    }
    </style>
</head>
<body>
    <!-- Header Section -->
    <header>
        <div class="nav-container">
            <a th:href="@{/home}"><img src="https://deq64r0ss2hgl.cloudfront.net/images/websitelogos/techmlsa_site_logo.jpg?v=8787" class="img" alt="Tech Mahindra Logo"></a>
            <div class="search-bar">
                <form th:action="@{/products/search}" method="get">
                    <input type="text" name="q" placeholder="Search products..." />
                    <button type="submit">🔍</button>
                </form>
            </div>
            <nav>
                <ul>
                    <li th:each="category : ${categories}">
                        <a th:text="${category.name}" th:href="@{'/category/' + ${category.id}}"></a>
                    </li>
                </ul>
            </nav>
            <div class="top-links">
    <a th:if="${!isAdmin}" th:href="@{/wishlist}">Wishlist</a>

    <!-- Show login if user not logged in -->
    <div th:if="${remoteUser == null}">
        <a th:href="@{/auth/loginPage}">
            <button>Login</button>
        </a>
    </div>

    <!-- Show account dropdown if user is logged in -->
    <div class="account-dropdown" th:if="${remoteUser != null}">
        <button>Hello, friend ⌄</button>
        <div class="dropdown-content">
            <form th:action="@{/logout}" method="post">
                <button type="submit">Logout</button>
            </form>
        </div>
    </div>
</div>

        </div>
    </header>
    <main class="products-section">
        <h2>Your Wishlist</h2>
        <div class="products-grid">
            <div class="product-card" th:each="item : ${wishlistItems}">
                <a th:href="@{'/product/' + ${item.product.id}}">
                    <img th:src="${item.product.imageUrl}" th:alt="${item.product.name}" />
                    <h3 th:text="${item.product.name}">Product Name</h3>
                </a>
                <form th:action="@{/wishlist/remove/{id}(id=${item.product.id})}" method="post">
                    <button type="submit" class="remove-btn">Remove</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
