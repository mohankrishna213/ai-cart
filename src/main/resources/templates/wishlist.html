<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Wishlist</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        color: #444;
    }
    .nav-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 20px;
        background-color: #f5f5f5;
    }
    .img {
        width: 150px;
        margin-bottom: 20px;
    }
    nav ul {
        display: flex;
        list-style: none;
        padding: 0;
        margin: 0;
    }
    nav ul li {
        margin: 0 10px;
        position: relative;
    }
    nav ul li.active a {
        border-bottom: 2px solid #333;
        color: #333;
        font-weight: bold;
    }
    .products-section {
        padding: 20px;
        background-color: #fafafa;
    }
    .products-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
    }
    .product-card {
        border: 1px solid #ddd;
        padding: 15px;
        text-align: center;
        background-color: white;
        position: relative;
    }
    .product-card img {
        width: 100%;
        height: auto;
        margin-bottom: 10px;
    }
    .remove-btn {
        background: #e25555;
        color: #fff;
        border: none;
        padding: 7px 16px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 1em;
        position: absolute;
        top: 10px;
        right: 10px;
        transition: background 0.2s;
    }
    .remove-btn:hover {
        background: #b71c1c;
    }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <img src="https://deq64r0ss2hgl.cloudfront.net/images/websitelogos/techmlsa_site_logo.jpg?v=8787" class="img" alt="Tech Mahindra Logo">
            <nav>
                <ul>
                    <li><a th:href="@{/home}">Home</a></li>
                    <li><a th:href="@{/wishlist}" style="font-weight:bold; border-bottom:2px solid #333;">Wishlist</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main class="products-section">
        <h2>Your Wishlist</h2>
        <div class="products-grid">
            <div class="product-card" th:each="item : ${wishlistItems}">
                <a th:href="@{'/product/' + ${item.product.id}}">
                    <img th:src="${item.product.imageUrl}" th:alt="${item.product.name}" />
                    <h3 th:text="${item.product.name}">Product Name</h3>
                </a>
                <form th:action="@{/wishlist/remove/{id}(id=${item.product.id})}" method="post">
                    <button type="submit" class="remove-btn">Remove</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
