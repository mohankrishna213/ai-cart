<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Product Form</title>
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
    <h1 th:text="${product.id == null ? 'Add Product' : 'Edit Product'}"></h1>
    <form th:action="@{${product.id == null ? '/products/admin' : '/products/admin/' + ${product.id}}}" 
          th:object="${product}" method="post">
        <label>Name:</label>
        <input type="text" th:field="*{name}" required /><br/>
        <label>Description:</label>
        <textarea th:field="*{description}" required></textarea><br/>
        <label>Price:</label>
        <input type="number" step="0.01" th:field="*{price}" required /><br/>
        <label>Stock Quantity:</label>
        <input type="number" th:field="*{stockQuantity}" required /><br/>
        <label>Image URL:</label>
        <input type="text" th:field="*{imageUrl}" /><br/>
        <label>Available:</label>
        <input type="checkbox" th:field="*{available}" /><br/>
        <button type="submit">Save</button>
    </form>
    <a href="/products/admin">Back to Admin Product List</a>
</body>
</html>
