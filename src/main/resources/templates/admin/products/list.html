<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Product List</title>
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
    <h1>Admin Product Management</h1>
    <a href="/products/admin/new">Add New Product</a>
    <table>
        <thead>
            <tr>
                <th>Name</th><th>Price</th><th>Stock</th><th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.name}">Name</td>
                <td th:text="${product.price}">Price</td>
                <td th:text="${product.stockQuantity}">Stock</td>
                <td>
                    <a th:href="@{'/products/admin/' + ${product.id} + '/edit'}">Edit</a>
                    <form th:action="@{'/products/admin/' + ${product.id} + '/delete'}" method="post" style="display:inline;">
                        <button type="submit">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
