<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tech Mahindra Store</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap');
        body {
            font-family: Nunito, sans-serif;
            margin: 0;
            padding: 0;
            color: #444;
        }
        a {
            text-decoration: none;
            color: #444;
        }
        .icon {
            font-family: "Font Awesome 6 Free";
            font-weight: 200;
        }
        .user::before {
            content: "\f007";
            margin-right: 8px;
        }
        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #ffffff;
        }

        .logo {
            font-weight: bold;
            font-size: 1.5em;
            color: #333;
        }

        .img {
            width: 150px;
            margin-bottom: 20px;
        }

        .search-bar {
            width: 490px;
            margin-top:10px;
            height:60px;
            margin-left: 200px;
            margin-right: auto;

        }

        .search-bar input[type="text"] {
            width: 100%;
            height: 45px;
            padding: 0 20px;
            font-size: 1rem;
            border: 1px solid #808080;
            outline: none;
            transition: border 0.35s ease, color 0.35s ease;
            border-radius:30px;
        }

        .search-bar input[type="text"]:focus {
            border: 1px solid #808080;
            color: #808080;
        }

        .search-bar input[type="text"]::placeholder {
            transition: opacity 0.45s ease;
        }

        .search-bar input[type="text"]:focus::placeholder {
            opacity: 0;
        }

        .search-bar button {
            position: relative;
            float: right;
            height: 45px;
            padding: 0 20px;
            font-size: 1.2rem;
            background: none;
            border: none;
            cursor: pointer;
        }


        nav ul {
            display: flex;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        nav ul li {
            margin: 0 10px;
        }

        .top-links {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .account-dropdown {
            position: relative;
        }

        .account-dropdown button {
            background: none;
            border: none;
            cursor: pointer;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            background-color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            padding: 10px;
        }

        .account-dropdown:hover .dropdown-content {
            display: block;
        }
        .category-container{
            display: flex;
            justify-content: center;
            margin-bottom:5px;
        }
        .admin-category-item {
            position: relative;
        }

        .admin-cat-dropdown {
            display: none;
            position: absolute;
            background: #fff;
            border: 1px solid #ccc;
            z-index: 10;
            min-width: 100px;
        }

        .admin-category-item:hover .admin-cat-dropdown {
            display: block;
        }


        .carousel {
            width: 100vw;
            max-width: 100%;
            overflow: hidden;
            margin: 0 auto;
        }

        .carousel-slide {
            display: flex;
            width: 300vw;
            animation: slide 18s infinite;
        }

        .carousel-slide img {
            width: 100vw;
            max-width: 100vw;
            max-height: 400px;
            object-fit: cover;
            flex-shrink: 0;
        }

        @keyframes slide {
            0% { transform: translateX(0vw); }
            27% { transform: translateX(0vw); }
            33% { transform: translateX(-100vw); }
            60% { transform: translateX(-100vw); }
            66% { transform: translateX(-200vw); }
            94% { transform: translateX(-200vw); }
            100% { transform: translateX(0vw); }
        }

        .products-section {
            padding: 20px;
            background-color: #fafafa;
        }

        .filter-bar{
            display: flex;
            justify-content: right;
            margin-top: 20px;
            gap: 8px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .product-card {
            border: 1px solid #ddd;
            padding: 15px;
            text-align: center;
            background-color: white;
        }

        .product-card img {
            width: 100%;
            height: auto;
        }

        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            gap: 8px;
        }

        .page-btn {
            padding: 6px 12px;
            text-decoration: none;
            color: #333;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .page-btn.active {
            background-color: #333;
            color: white;
            border-color: #333;
        }
        .filter-dropdown {
            position: relative;
            display: inline-block;
        }

        .filter-btn {
            background-color: #fff;
            border: 1px solid #ccc;
            padding: 8px 12px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filter-btn i {
            font-size: 1.1rem;
        }

        .filter-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            background-color: #fff;
            border: 1px solid #ccc;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            padding: 10px;
            z-index: 100;
            min-width: 200px;
            flex-direction: column;
            gap: 10px;
        }

        .filter-dropdown:hover .filter-menu {
            display: flex;
        }

        .filter-option {
            display: block;
            padding: 6px 10px;
            color: #333;
            text-decoration: none;
            border-bottom: 1px solid #eee;
        }

        .filter-option:last-child {
            border-bottom: none;
        }

        .price-range-form {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .price-range-form input {
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .price-range-form button {
            padding: 6px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

    </style>
</head>
<body>
<!-- Header Section -->
<div th:replace="fragments/header :: header"></div>
<div th:if="${!isAdmin}" class="category-container">
    <nav>
        <ul style="display: flex;">
            <li th:if="${!isAdmin}" th:each="category : ${categories}">
                <a th:text="${category.name}" th:href="@{'/category/' + ${category.id}}"></a>
            </li>
        </ul>
    </nav>
</div>
<!-- Admin Category Controls -->
<div th:if="${isAdmin}" class="category-container">
    <nav>
        <ul style="display: flex;">
            <li class="admin-category-item" th:each="category : ${categories}">
                <a th:text="${category.name}" th:href="@{'/category/' + ${category.id}}"></a>
                <div class="admin-cat-dropdown">
                    <button
                            th:attr="data-id=${category.id},data-name=${category.name},data-description=${category.description}"
                            onclick="editCategoryFromData(this)">Edit</button>
                    <button th:onclick="'deleteCategory(' + ${category.id} + ')'">Delete</button>
                </div>
            </li>

            <li>
                <button onclick="openAddCategoryModal()">Add Category</button>
            </li>
        </ul>
    </nav>
</div>

<!-- Category Modal Popup -->
<div id="categoryModal" style="display:none; position:fixed; top:20%; left:50%; transform:translate(-50%,0); background:#fff; border:1px solid #ccc; padding:20px; z-index:100;">
    <form id="categoryForm">
        <input type="hidden" id="catId" name="id" />
        <label>Name: <input type="text" id="catName" name="name" required /></label><br><br>
        <label>Description: <textarea id="catDesc" name="description" required></textarea></label><br><br>
        <button type="submit">Save</button>
        <button type="button" onclick="closeCategoryModal()">Cancel</button>
    </form>
</div>

<script>
    // Show dropdown on hover for admin categories
    document.querySelectorAll('li[th\\:each="category : ${categories}"]').forEach(function(li) {
        li.addEventListener('mouseenter', function() {
            var dropdown = li.querySelector('.admin-cat-dropdown');
            if(dropdown) dropdown.style.display = 'block';
        });
        li.addEventListener('mouseleave', function() {
            var dropdown = li.querySelector('.admin-cat-dropdown');
            if(dropdown) dropdown.style.display = 'none';
        });
    });

    function openAddCategoryModal() {
        document.getElementById('catId').value = '';
        document.getElementById('catName').value = '';
        document.getElementById('catDesc').value = '';
        document.getElementById('categoryModal').style.display = 'block';
    }
    function openEditCategoryModal(id, name, description) {
        document.getElementById('catId').value = id;
        document.getElementById('catName').value = name;
        document.getElementById('catDesc').value = description;
        document.getElementById('categoryModal').style.display = 'block';
    }
    function closeCategoryModal() {
        document.getElementById('categoryModal').style.display = 'none';
    }
    document.getElementById('categoryForm').onsubmit = function(e) {
        e.preventDefault();
        var id = document.getElementById('catId').value;
        var name = document.getElementById('catName').value;
        var description = document.getElementById('catDesc').value;
        var url = id ? '/admin/category/edit' : '/admin/category/add';
        var payload = id ? { id, name, description } : { name, description };
        fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(r => r.json()).then(data => {
            location.reload();
        });
    };
    function deleteCategory(id) {
        if(confirm('Delete this category?')) {
            fetch('/admin/category/delete/' + id, { method: 'DELETE' })
                .then(r => r.json()).then(data => { location.reload(); });
        }
    }
    function editCategoryFromData(btn) {
        openEditCategoryModal(
            btn.getAttribute('data-id'),
            btn.getAttribute('data-name'),
            btn.getAttribute('data-description')
        );
    }
</script>

<!-- Carousel -->
<section class="carousel">
    <div class="carousel-slide">
        <img src="https://deq64r0ss2hgl.cloudfront.net/images/opt/flashgallary/large/Banner-3_2090804870.jpg.webp?v=8787" alt="Slide 1" />
        <img src="https://deq64r0ss2hgl.cloudfront.net/images/opt/flashgallary/large/Banner-1_7218174766.jpg.webp?v=8787" alt="Slide 2" />
        <img src="https://deq64r0ss2hgl.cloudfront.net/images/opt/flashgallary/large/Banner-2_2111601589.jpg.webp?v=8787" alt="Slide 3" />
    </div>
</section>

<!-- Products -->
<main class="products-section">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2>Our Products</h2>

        <div class="filter-dropdown">
            <button class="filter-btn">
                <i class="fas fa-filter"></i> Filter
            </button>
            <div class="filter-menu">
                <a th:href="@{/(filter='available')}" class="filter-option">Show Available</a>
                <a th:href="@{/(filter='top-rated')}" class="filter-option">Top Rated</a>
                <form th:action="@{/}" method="get" class="filter-option price-range-form">
                    <input type="hidden" name="filter" value="price-range" />
                    <input type="number" name="minPrice" placeholder="Min ₹" required />
                    <input type="number" name="maxPrice" placeholder="Max ₹" required />
                    <button type="submit">Apply</button>
                </form>
            </div>
        </div>
    </div>


    <div class="products-grid">
        <div class="product-card" th:each="product : ${products}">
            <a th:href="@{'/product/' + ${product.id}}">
                <img th:src="@{${product.imageUrl}}" th:alt="${product.name}" />
                <h3 th:text="${product.name}">Product Name</h3>
                <p th:text="'₹ ' + ${product.price}">Price</p>
            </a>
        </div>
    </div>

    <!-- Pagination -->
    <div class="pagination" th:if="${totalPages > 1}">
        <a th:if="${currentPage > 0}"
           th:href="@{/(page=${currentPage - 1}, size=${size}, sortBy=${sortBy}, sortDir=${sortDir}, filter=${filter}, minPrice=${minPrice}, maxPrice=${maxPrice})}"
           class="page-btn">« Prev</a>

        <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
		        <a th:href="@{/(page=${i}, size=${size}, sortBy=${sortBy}, sortDir=${sortDir}, filter=${filter}, minPrice=${minPrice}, maxPrice=${maxPrice})}"
                   th:text="${i + 1}"
                   th:classappend="${i == currentPage} ? 'active' : ''"
                   class="page-btn"></a>
		    </span>

        <a th:if="${currentPage < totalPages - 1}"
           th:href="@{/(page=${currentPage + 1}, size=${size}, sortBy=${sortBy}, sortDir=${sortDir}, filter=${filter}, minPrice=${minPrice}, maxPrice=${maxPrice})}"
           class="page-btn">Next »</a>
    </div>



</main>

<!-- Include Chatbot Fragment -->
<div th:replace="fragments/chatbot :: chatbot"></div>
</body>
</html>
