<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Cart – Premium Products</title>
    <meta name="description" content="Discover premium products at AI Cart. Shop top-rated electronics, gadgets, and more.">
    <link rel="icon" th:href="@{/images/Ecommerce_Favicon.png}" type="image/png">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>

<!-- Header Section -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- Customer Category Nav -->
<div th:if="${!isAdmin}" class="category-container">
    <nav>
        <ul>
            <li th:each="category : ${categories}">
                <a th:text="${category.name}" th:href="@{'/category/' + ${category.id}}"></a>
            </li>
        </ul>
    </nav>
</div>

<!-- Admin Category Nav -->
<div th:if="${isAdmin}" class="category-container">
    <nav>
        <ul>
            <li class="admin-category-item" th:each="category : ${categories}">
                <a th:text="${category.name}" th:href="@{'/category/' + ${category.id}}"></a>
                <div class="admin-cat-dropdown">
                    <button
                        th:attr="data-id=${category.id},data-name=${category.name},data-description=${category.description}"
                        onclick="editCategoryFromData(this)">
                        <i class="fas fa-edit"></i> Edit
                    </button>
                    <button th:onclick="'deleteCategory(' + ${category.id} + ')'">
                        <i class="fas fa-trash"></i> Delete
                    </button>
                </div>
            </li>
            <li>
                <a href="javascript:void(0)" onclick="openAddCategoryModal()" style="color: var(--primary); font-weight: 600;">
                    <i class="fas fa-plus-circle"></i> Add Category
                </a>
            </li>
        </ul>
    </nav>
</div>

<!-- Category Modal -->
<div id="categoryModal" class="popup-card">
    <div class="popup-content">
        <button class="popup-close" onclick="closeCategoryModal()">&times;</button>
        <h3 id="categoryModalTitle">Add Category</h3>
        <form id="categoryForm">
            <input type="hidden" id="catId" name="id" />
            <input type="text" id="catName" name="name" placeholder="Category name" required />
            <textarea id="catDesc" name="description" placeholder="Category description" required></textarea>
            <button type="submit">Save Category</button>
        </form>
    </div>
</div>

<script>
    function openAddCategoryModal() {
        document.getElementById('catId').value = '';
        document.getElementById('catName').value = '';
        document.getElementById('catDesc').value = '';
        document.getElementById('categoryModalTitle').textContent = 'Add Category';
        document.getElementById('categoryModal').style.display = 'flex';
    }

    function openEditCategoryModal(id, name, description) {
        document.getElementById('catId').value = id;
        document.getElementById('catName').value = name;
        document.getElementById('catDesc').value = description;
        document.getElementById('categoryModalTitle').textContent = 'Edit Category';
        document.getElementById('categoryModal').style.display = 'flex';
    }

    function closeCategoryModal() {
        document.getElementById('categoryModal').style.display = 'none';
    }

    document.getElementById('categoryForm').onsubmit = function(e) {
        e.preventDefault();
        var id = document.getElementById('catId').value;
        var name = document.getElementById('catName').value;
        var description = document.getElementById('catDesc').value;
        var url = id ? '/admin/category/edit' : '/admin/category/add';
        var payload = id ? { id, name, description } : { name, description };
        fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(r => r.json()).then(data => {
            location.reload();
        });
    };

    function deleteCategory(id) {
        if(confirm('Are you sure you want to delete this category?')) {
            fetch('/admin/category/delete/' + id, { method: 'DELETE' })
                .then(r => r.json()).then(data => { location.reload(); });
        }
    }

    function editCategoryFromData(btn) {
        openEditCategoryModal(
            btn.getAttribute('data-id'),
            btn.getAttribute('data-name'),
            btn.getAttribute('data-description')
        );
    }

    // Close modal on backdrop click
    document.getElementById('categoryModal').addEventListener('click', function(e) {
        if (e.target === this) closeCategoryModal();
    });
</script>

<!-- Banner Carousel -->
<section class="carousel">
    <div class="carousel-slide">
        <img th:src="@{/images/Banner_1.png}" alt="Slide 1" />
        <img th:src="@{/images/Banner_2.png}" alt="Slide 2" />
        <img th:src="@{/images/Banner_3.png}" alt="Slide 3" />
    </div>
</section>

<!-- Products Section -->
<main class="products-section">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
        <h2>Our Products</h2>

        <div class="filter-dropdown">
            <button class="filter-btn">
                <i class="fas fa-sliders-h"></i> Filter
            </button>
            <div class="filter-menu">
                <a th:href="@{/(filter='available')}" class="filter-option">
                    <i class="fas fa-check-circle" style="color: var(--accent-green); margin-right: 8px;"></i> Show Available
                </a>
                <a th:href="@{/(filter='top-rated')}" class="filter-option">
                    <i class="fas fa-star" style="color: var(--star-color); margin-right: 8px;"></i> Top Rated
                </a>
                <form th:action="@{/}" method="get" class="price-range-form">
                    <input type="hidden" name="filter" value="price-range" />
                    <input type="number" name="minPrice" placeholder="Min ₹" required />
                    <input type="number" name="maxPrice" placeholder="Max ₹" required />
                    <button type="submit">Apply Price Filter</button>
                </form>
            </div>
        </div>
    </div>

    <div class="products-grid" style="margin-top: 24px;">
        <div class="product-card" th:each="product : ${products}">
            <a th:href="@{'/product/' + ${product.id}}">
                <img th:src="@{${product.imageUrl}}" th:alt="${product.name}" />
                <h3 th:text="${product.name}">Product Name</h3>
                <p th:text="'₹ ' + ${product.price}">Price</p>
            </a>
        </div>
    </div>

    <!-- Pagination -->
    <div class="pagination" th:if="${totalPages > 1}">
        <a th:if="${currentPage > 0}"
           th:href="@{/(page=${currentPage - 1}, size=${size}, sortBy=${sortBy}, sortDir=${sortDir}, filter=${filter}, minPrice=${minPrice}, maxPrice=${maxPrice})}"
           class="page-btn">« Prev</a>

        <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
            <a th:href="@{/(page=${i}, size=${size}, sortBy=${sortBy}, sortDir=${sortDir}, filter=${filter}, minPrice=${minPrice}, maxPrice=${maxPrice})}"
               th:text="${i + 1}"
               th:classappend="${i == currentPage} ? 'active' : ''"
               class="page-btn"></a>
        </span>

        <a th:if="${currentPage < totalPages - 1}"
           th:href="@{/(page=${currentPage + 1}, size=${size}, sortBy=${sortBy}, sortDir=${sortDir}, filter=${filter}, minPrice=${minPrice}, maxPrice=${maxPrice})}"
           class="page-btn">Next »</a>
    </div>
</main>

<!-- Footer -->
<footer class="footer">
    <p>© 2026 AI Cart · Capstone Project · For Educational Purposes Only</p>
</footer>


</body>
</html>
