<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tech Mahindra Store</title>
    <link rel="stylesheet" href="/css/home.css">
    <style>
    body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
}

.nav-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
    background-color: #f5f5f5;
}

.logo {
    font-weight: bold;
    font-size: 1.5em;
    color: #333;
}

.search-bar input {
    padding: 5px;
    width: 200px;
}

nav ul {
    display: flex;
    list-style: none;
    padding: 0;
    margin: 0;
}

nav ul li {
    margin: 0 10px;
}

.top-links {
    display: flex;
    gap: 15px;
    align-items: center;
}

.account-dropdown {
    position: relative;
}

.account-dropdown button {
    background: none;
    border: none;
    cursor: pointer;
}

.dropdown-content {
    display: none;
    position: absolute;
    top: 100%;
    right: 0;
    background-color: white;
    box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    padding: 10px;
}

.account-dropdown:hover .dropdown-content {
    display: block;
}

.carousel {
    width: 100%;
    overflow: hidden;
}

.carousel-slide {
    display: flex;
    animation: slide 10s infinite;
}

.carousel-slide img {
    width: 100%;
    max-height: 400px;
    object-fit: cover;
}

@keyframes slide {
    0% { transform: translateX(0%); }
    33% { transform: translateX(-100%); }
    66% { transform: translateX(-200%); }
    100% { transform: translateX(0%); }
}

.products-section {
    padding: 20px;
    background-color: #fafafa;
}

.products-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
}

.product-card {
    border: 1px solid #ddd;
    padding: 15px;
    text-align: center;
    background-color: white;
}

.product-card img {
    width: 100%;
    height: auto;
}
.img {
    width: 150px;
    margin-bottom: 20px;
}
    
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <img src="https://deq64r0ss2hgl.cloudfront.net/images/websitelogos/techmlsa_site_logo.jpg?v=8787" class="img" alt="Tech Mahindra Logo">
            <div class="search-bar">
                <form th:action="@{/getproductbyname}" method="get">
                    <input type="text" name="name" placeholder="Search" />
                    <button type="submit">🔍</button>
                </form>
            </div>
            <nav>
                <ul>
                    <li th:each="category : ${categories}">
                        <a th:text="${category}" href="#"></a>
                    </li>
                </ul>
            </nav>
            <div class="top-links">
                <a href="#" th:href="@{/wishlist}">Wishlist</a>
                <div class="account-dropdown">
                    <button>Hello, friend! ⌄</button>
                    <div class="dropdown-content">
                        <form th:action="@{/logout}" method="post">
                            <button type="submit">Logout</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Carousel Section -->
    <section class="carousel">
        <div class="carousel-slide">
            <img src="https://deq64r0ss2hgl.cloudfront.net/images/opt/flashgallary/large/Banner-3_2090804870.jpg.webp?v=8787" alt="Slide 1" />
            <img src="https://deq64r0ss2hgl.cloudfront.net/images/opt/flashgallary/large/Banner-1_7218174766.jpg.webp?v=8787" alt="Slide 2" />
            <img src="https://deq64r0ss2hgl.cloudfront.net/images/opt/flashgallary/large/Banner-2_2111601589.jpg.webp?v=8787" alt="Slide 3" />
        </div>
    </section>

    <main class="products-section">
    <h2>Our Products</h2>
    <div class="products-grid">
        <div class="product-card" th:each="product : ${products}">
            <img th:src="@{${product.imageUrl}}" th:alt="${product.name}" />
            <h3 th:text="${product.name}">Product Name</h3>
            <p th:text="'₹ ' + ${product.price}">Price</p>
        </div>
    </div>

    Pagination Controls
    <div class="pagination">
        <a th:if="${currentPage > 0}"
           th:href="@{'/?page=' + (${currentPage - 1})}" class="page-btn">« Prev</a>

        <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
            <a th:href="@{'/?page=' + ${i}}"
               th:text="${i + 1}"
               th:classappend="${i == currentPage} ? 'active' : ''"
               class="page-btn"></a>
        </span>

        <a th:if="${currentPage < totalPages - 1}"
           th:href="@{'/?page=' + (${currentPage + 1})}" class="page-btn">Next »</a>
    </div>
</main>
</body>
</html>
