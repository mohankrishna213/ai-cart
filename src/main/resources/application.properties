# Database Configuration
spring.datasource.url=${LOCAL_DATASOURCE_URL}
spring.datasource.username=${LOCAL_DATASOURCE_USERNAME}
spring.datasource.password=${LOCAL_DATASOURCE_PASSWORD}

# Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# OAuth2 (Google Login)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Redis Configuration
spring.data.redis.host=${LOCAL_REDIS_HOST}
spring.data.redis.port=6379
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD}

# Cache Configuration
spring.cache.type=redis

# -------------------------------------------------------
# Google AI Studio - Chat (Gemma 4)
# Shared API key used by both chat and embedding modules.
# -------------------------------------------------------
spring.ai.google.genai.embedding.api-key=${GOOGLE_GENAI_EMBEDDING_API_KEY}

spring.ai.google.genai.api-key=${GOOGLE_GENAI_API_KEY}
spring.ai.google.genai.chat.options.model=gemma-4-31b-it
spring.ai.google.genai.chat.options.temperature=0.7
spring.ai.google.genai.chat.options.max-tokens=500

# -------------------------------------------------------
# Google AI Studio - Embeddings (text-embedding-004)
# Property prefix for the embedding module is:
#   spring.ai.google.genai.embedding.text.options.*
# NOT spring.ai.google.genai.embedding.model (that key doesn't exist)
# -------------------------------------------------------
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001

# -------------------------------------------------------
# Vector Store
# -------------------------------------------------------
spring.ai.vectorstore.simple.enabled=true

# Chat / RAG Configuration
chatbot.context.max-results=5
chatbot.similarity.threshold=0.5