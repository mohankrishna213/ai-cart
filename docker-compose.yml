version: '3.8'

services:

  db:
    image: mysql:8.0
    container_name: product_catalog_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: product_catalog
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpwd
      MYSQL_ROOT_PASSWORD: rootpwd
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpwd"]
      interval: 10s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: product_catalog_app
    depends_on:
      - db
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/product_catalog?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpwd
    ports:
      - '8080:8080'

volumes:
  mysql-data: